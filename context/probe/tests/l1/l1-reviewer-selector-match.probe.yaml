id: l1-reviewer-selector-match
name: reviewer-selector matches appropriate reviewers to paper topics
tier: L1
plugin: panel
target: shared/reviewer-selector.md
timeout: 30

description: |
  Verify reviewer-selector picks 5 reviewers whose expertise matches
  the paper topic, returns no duplicates, and draws from the 45+
  reviewer database.

steps:
  - action: invoke-selector
    paper_topic: "Cookie crumb pattern analysis and classification"
    paper_venue: "CVPR 2026"
    reviewer_db: tests/fixtures/mock-monorepo/cookie-science/REVIEWER-DATABASE.md
    count: 5
    store: selected

  - action: assert-array-length
    input: $selected
    expected: 5

  - action: assert-no-duplicates
    input: $selected
    key: name

  - action: assert-each-has-field
    input: $selected
    fields: [name, affiliation, expertise]

  - action: assert-topic-relevance
    input: $selected
    topic: "cookie crumb pattern analysis"
    description: "Selected reviewers should include Food Science experts (Cookie Monster, Swedish Chef)"

  - action: invoke-selector
    paper_topic: "Near-far distance metrics for spatial reasoning"
    paper_venue: "AAMAS 2026"
    reviewer_db: tests/fixtures/mock-monorepo/grover-adventures/REVIEWER-DATABASE.md
    count: 5
    store: grover_selected

  - action: assert-topic-relevance
    input: $grover_selected
    topic: "near-far distance metrics"
    description: "Should include Navigation experts (Grover, Big Bird)"
