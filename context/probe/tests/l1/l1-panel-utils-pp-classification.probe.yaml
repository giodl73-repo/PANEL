id: l1-panel-utils-pp-classification
name: panel-utils generates PP1/PP2/PP3 findings correctly
tier: L1
plugin: panel
target: shared/panel-utils.md
timeout: 30

description: |
  Verify panel-utils classifies cross-paper findings:
  PP1 = cross-paper pattern or threatens module (blocking)
  PP2 = 2+ papers affected (important)
  PP3 = 1 paper only (nice-to-have)

steps:
  # Load real paper findings from cookie-science module (5 papers, all reviewed)
  - action: load-paper-states
    module: tests/fixtures/mock-monorepo/cookie-science
    store: findings
    description: "Load all 5 cookie-science papers: chip-distribution, crumb-analysis, dunk-methodology, optimal-cookie, sharing-economics"

  - action: invoke-panel-classify
    input: $findings
    store: pp_results

  - action: assert-pp1-exists
    input: $pp_results
    description: "Cross-paper P1 patterns detected across cookie-science papers"

  - action: assert-pp2-exists
    input: $pp_results
    description: "PP2 items identified (2+ paper patterns)"

  # Verify against actual REVIEW_PANEL.md content
  - action: read-file
    path: tests/fixtures/mock-monorepo/cookie-science/REVIEW_PANEL.md
    store: actual_panel

  - action: assert-contains
    input: $actual_panel
    pattern: "PP1"
    description: "Cookie-science REVIEW_PANEL.md contains PP1 findings (methodology inconsistency)"

  - action: assert-contains
    input: $actual_panel
    pattern: "PP2"
    description: "Cookie-science REVIEW_PANEL.md contains PP2 findings"
