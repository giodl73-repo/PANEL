id: l2-show-detail
name: "panel:show displays detailed paper view with reviews and history"
tier: L2
plugin: panel
target: commands/show.md
timeout: 60

description: |
  Verify panel:show reads a paper's _panel.yaml and displays
  detailed view including reviews, score history, and stage timeline.

steps:
  - action: prepare-paper
    fixture: fixtures/sample-panel-state.yaml

  - action: invoke-skill
    skill: "panel:show panel-review-methodology"
    sandbox: true
    store: output

  - action: assert-contains
    input: $output
    pattern: "panel-review-methodology"
    description: Shows paper name

  - action: assert-contains
    input: $output
    pattern: "synthesis"
    description: Shows current stage

  - action: assert-contains
    input: $output
    pattern: "Percy Liang"
    description: Shows reviewer names

  - action: assert-contains
    input: $output
    pattern: "3.0"
    description: Shows score
