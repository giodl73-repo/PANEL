id: l2-show-detail
name: "panel:show displays detailed paper view with reviews and history"
tier: L2
plugin: panel
target: commands/show.md
timeout: 60

description: |
  Verify panel:show reads a paper's _panel.yaml and displays
  detailed view including reviews, score history, and stage timeline.

steps:
  # Use chip-distribution — the most complete paper (round 2, ready, full history)
  - action: prepare-paper
    fixture: tests/fixtures/mock-monorepo/cookie-science/panel-chip-distribution/_panel.yaml
    reviews: tests/fixtures/mock-monorepo/cookie-science/panel-chip-distribution/reviews
    description: "Cookie Monster's chip distribution — ready stage, round 2, 5 reviewers"

  - action: invoke-skill
    skill: "panel:show panel-chip-distribution"
    sandbox: true
    store: output

  - action: assert-contains
    input: $output
    pattern: "chip-distribution"
    description: Shows paper name

  - action: assert-contains
    input: $output
    pattern: "ready"
    description: Shows current stage

  - action: assert-contains
    input: $output
    pattern: "Cookie Monster"
    description: Shows reviewer names

  - action: assert-contains
    input: $output
    pattern: "Count von Count"
    description: Shows Count von Count as reviewer

  - action: assert-contains-any
    input: $output
    patterns: ["3.2", "Strong Accept"]
    description: Shows scores or verdicts
