id: l3-three-tier-flow-down
name: "Top-down: board B1/B2 to panel PP1/PP2 to paper revisions"
tier: L3
plugin: panel
target:
  - commands/board.md
  - commands/convene.md
  - commands/review.md
timeout: 120

description: |
  End-to-end top-down flow: board generates B1/B2 findings per module,
  panel translates to PP1/PP2 per paper, papers receive revision plans
  and apply edits to LaTeX source.

steps:
  # Top-down flow using the Sesame Street monorepo
  - action: prepare-monorepo
    source: tests/fixtures/mock-monorepo
    description: "Full Sesame Street monorepo with 3 modules"

  # Board generates B1/B2 findings and per-module revision plans
  - action: invoke-skill
    skill: "panel:board --revisions --repo tests/fixtures/mock-monorepo"
    sandbox: true
    store: board_revisions

  - action: glob
    pattern: tests/fixtures/mock-monorepo/BOARD-REVISION-PLAN-*.md
    store: board_plans

  - action: assert-count-gte
    input: $board_plans
    expected: 1
    description: "Board generates per-module revision plans (cookie-science, grover-adventures)"

  # Panel applies board findings down to papers
  - action: invoke-skill
    skill: "panel:convene --apply"
    sandbox: true
    cwd: tests/fixtures/mock-monorepo/cookie-science
    store: panel_apply

  - action: read-file
    path: tests/fixtures/mock-monorepo/cookie-science/panel-chip-distribution/_panel.yaml
    store: paper_state

  - action: assert-non-empty
    input: $paper_state
    description: "Cookie Monster's chip-distribution state updated from top-down revisions"
