id: l3-five-paper-portfolio
name: "Full portfolio: all 5 research papers through review + panel synthesis"
tier: L3
plugin: panel
target:
  - commands/review.md
  - commands/convene.md
  - commands/status.md
timeout: 120

description: |
  End-to-end portfolio test: advance all 5 research papers through
  at least the synthesis stage, then run panel:module review to produce
  a cross-portfolio assessment, and verify panel:status reflects all.

papers:
  - panel-chip-distribution
  - panel-crumb-analysis
  - panel-dunk-methodology
  - panel-optimal-cookie-consumption
  - panel-sharing-economics

steps:
  # Use the complete cookie-science module — 5 papers at various stages
  - action: prepare-module
    source: tests/fixtures/mock-monorepo/cookie-science
    description: "Cookie Science Lab: 5 papers (chip-distribution, crumb-analysis, dunk-methodology, optimal-cookie, sharing-economics)"

  - action: invoke-skill
    skill: "panel:module review"
    sandbox: true
    store: panel_result

  - action: file-exists
    path: research/REVIEW_PANEL.md

  - action: invoke-skill
    skill: "panel:status"
    sandbox: true
    store: status_output

  - action: assert-contains
    input: $status_output
    pattern: "chip-distribution"
    description: "Cookie Monster's chip distribution paper listed"
  - action: assert-contains
    input: $status_output
    pattern: "crumb-analysis"
    description: "Crumb analysis paper listed"
  - action: assert-contains
    input: $status_output
    pattern: "dunk-methodology"
    description: "Dunk methodology paper listed"
  - action: assert-contains
    input: $status_output
    pattern: "optimal-cookie"
    description: "Optimal cookie consumption paper listed"
  - action: assert-contains
    input: $status_output
    pattern: "sharing-economics"
    description: "Cookie sharing economics paper listed"

  # Verify portfolio rankings match actual scores
  - action: read-file
    path: tests/fixtures/mock-monorepo/cookie-science/REVIEW_PANEL.md
    store: reference

  - action: assert-contains
    input: $reference
    pattern: "3.4/4"
    description: "Chip distribution ranked highest at 3.4/4"

  - action: assert-contains
    input: $reference
    pattern: "2.6/4"
    description: "Sharing economics ranked lowest at 2.6/4"
