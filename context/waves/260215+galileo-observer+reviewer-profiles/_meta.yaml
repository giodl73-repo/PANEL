description: |
  Implement persistent reviewer profiles to reduce token costs by 60-75%
  in AI-simulated expert reviews. Following craft's discipline pattern,
  create structured markdown profiles stored in context/panel/reviewers/profiles/
  that are loaded once and reused across review rounds and papers.

plan: |
  Phase 0: Design & Paper (validate approach via research paper FIRST)
  Phase 1: Create profile infrastructure (template, loader, registry)
  Phase 2: Generate initial 45 profiles from REVIEWER-DATABASE.md
  Phase 3: Integrate with review commands (panel:review, panel:convene)
  Phase 4: Add profile management commands (panel:reviewers enhancements)
  Phase 5: Testing & validation (A/B comparison, experimental paper)

