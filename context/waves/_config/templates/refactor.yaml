name: "Code Refactoring"
slug: refactor
version: "1.0"
description: "Systematic code refactoring with analysis, migration planning, incremental execution, and validation. Use for improving code quality, architecture, or technical debt reduction."
tags: [refactor, technical-debt, architecture, migration, cleanup]

estimated_hours:
  min: 16
  max: 40

roles: [architect, backend, frontend, testing, documentation]

variables:
  required:
    - name: waveName
      type: string
      description: "Name of the refactoring wave"
    - name: refactorScope
      type: string
      description: "Area or components being refactored"
  optional:
    - name: priority
      type: string
      default: "medium"
      description: "Priority level (low, medium, high, critical)"
    - name: breakingChanges
      type: string
      default: "false"
      description: "Whether this refactor introduces breaking changes"
    - name: deprecationPeriod
      type: string
      default: ""
      description: "Deprecation timeline for old APIs if applicable"

stages:
  design:
    pulses:
      - slug_suffix: analysis
        title: "Current State Analysis"
        role: architect
        estimated_hours: 4
        tasks:
          - "Document current architecture and pain points"
          - "Identify code smells and technical debt"
          - "Map dependencies and coupling"
          - "Assess risk areas and potential impact"
          - "Gather metrics on current code quality"
        dependencies: []

      - slug_suffix: migration-plan
        title: "Migration Plan"
        role: architect
        estimated_hours: 3
        tasks:
          - "Define target state architecture"
          - "Create incremental migration steps"
          - "Identify rollback strategies"
          - "Plan feature flags for gradual rollout"
          - "Define success criteria and metrics"
          - "Document breaking changes and migration guide"
        dependencies: [~analysis]

  execution:
    pulses:
      - slug_suffix: preparation
        title: "Refactoring Preparation"
        role: backend
        estimated_hours: 3
        tasks:
          - "Set up feature flags if needed"
          - "Create compatibility layers or adapters"
          - "Add monitoring and logging for comparison"
          - "Ensure comprehensive test coverage exists"
          - "Create branch strategy for incremental work"
        dependencies: [~migration-plan]

      - slug_suffix: core-refactor
        title: "Core Refactoring"
        role: backend
        estimated_hours: 8
        tasks:
          - "Execute primary refactoring changes"
          - "Maintain backward compatibility where required"
          - "Update affected components incrementally"
          - "Run tests after each significant change"
          - "Document any deviations from plan"
        dependencies: [~preparation]

      - slug_suffix: cleanup
        title: "Cleanup and Migration"
        role: backend
        estimated_hours: 4
        tasks:
          - "Remove deprecated code paths"
          - "Clean up feature flags"
          - "Update import paths and references"
          - "Remove compatibility layers when safe"
          - "Final code organization and formatting"
        dependencies: [~core-refactor]

  validation:
    pulses:
      - slug_suffix: regression-testing
        title: "Regression Testing"
        role: testing
        estimated_hours: 5
        tasks:
          - "Execute full regression test suite"
          - "Compare behavior before and after"
          - "Verify no functionality was lost"
          - "Performance comparison testing"
          - "Memory and resource usage analysis"
        dependencies: [~cleanup]

      - slug_suffix: validation
        title: "Quality Validation"
        role: testing
        estimated_hours: 3
        tasks:
          - "Code quality metrics comparison"
          - "Static analysis and linting"
          - "Review against success criteria"
          - "Stakeholder sign-off"
          - "Production readiness check"
        dependencies: [~regression-testing]

  documentation:
    pulses:
      - slug_suffix: docs-update
        title: "Documentation Update"
        role: documentation
        estimated_hours: 3
        tasks:
          - "Update architecture documentation"
          - "Document new patterns and conventions"
          - "Create migration guide for consumers"
          - "Update API documentation if changed"
          - "Write postmortem on refactoring learnings"
        dependencies: [~validation]
