name: "Foundation Setup"
slug: foundation
version: "1.0"
description: "Project foundation and initial setup including core architecture, tooling, and initial features. Use for new projects, major version bootstrapping, or significant infrastructure changes."
tags: [foundation, setup, architecture, infrastructure, bootstrap]

estimated_hours:
  min: 32
  max: 60

roles: [architect, backend, frontend, devops, testing, documentation]

variables:
  required:
    - name: waveName
      type: string
      description: "Name of the foundation wave"
    - name: projectName
      type: string
      description: "Name of the project being set up"
  optional:
    - name: techStack
      type: string
      default: ""
      description: "Primary technology stack (e.g., Python/FastAPI, Node/React)"
    - name: deploymentTarget
      type: string
      default: ""
      description: "Target deployment environment (e.g., AWS, Azure, Kubernetes)"
    - name: teamSize
      type: string
      default: "small"
      description: "Expected team size (small, medium, large)"

stages:
  design:
    pulses:
      - slug_suffix: vision
        title: "Project Vision and Goals"
        role: architect
        estimated_hours: 3
        tasks:
          - "Define project objectives and success metrics"
          - "Identify key stakeholders and users"
          - "Document constraints and assumptions"
          - "Create initial project roadmap"
          - "Define MVP scope"
        dependencies: []

      - slug_suffix: architecture
        title: "Architecture Design"
        role: architect
        estimated_hours: 5
        tasks:
          - "Select technology stack with rationale"
          - "Design high-level system architecture"
          - "Define component boundaries and interfaces"
          - "Plan data storage and access patterns"
          - "Design authentication and authorization approach"
          - "Create architecture decision records (ADRs)"
        dependencies: [~vision]

      - slug_suffix: standards
        title: "Development Standards"
        role: architect
        estimated_hours: 3
        tasks:
          - "Define coding standards and conventions"
          - "Establish git workflow and branching strategy"
          - "Define code review process"
          - "Set up quality gates and metrics"
          - "Document API design guidelines"
        dependencies: [~architecture]

  execution:
    pulses:
      - slug_suffix: repo-setup
        title: "Repository Setup"
        role: devops
        estimated_hours: 4
        tasks:
          - "Initialize repository structure"
          - "Configure gitignore and editorconfig"
          - "Set up pre-commit hooks"
          - "Configure branch protection rules"
          - "Create initial README and CONTRIBUTING docs"
        dependencies: [~standards]

      - slug_suffix: tooling
        title: "Development Tooling"
        role: devops
        estimated_hours: 5
        tasks:
          - "Configure linters and formatters"
          - "Set up build system and scripts"
          - "Configure testing frameworks"
          - "Set up local development environment"
          - "Create Docker development containers"
          - "Configure IDE settings and extensions"
        dependencies: [~repo-setup]

      - slug_suffix: cicd
        title: "CI/CD Pipeline"
        role: devops
        estimated_hours: 6
        tasks:
          - "Set up continuous integration pipeline"
          - "Configure automated testing in CI"
          - "Set up code quality checks"
          - "Configure deployment pipelines"
          - "Set up environment management"
          - "Configure secrets management"
        dependencies: [~tooling]

      - slug_suffix: core-backend
        title: "Core Backend Setup"
        role: backend
        estimated_hours: 8
        tasks:
          - "Set up application framework and structure"
          - "Implement configuration management"
          - "Set up database and migrations"
          - "Implement authentication framework"
          - "Create base API structure"
          - "Set up logging and monitoring"
        dependencies: [~tooling]

      - slug_suffix: core-frontend
        title: "Core Frontend Setup"
        role: frontend
        estimated_hours: 8
        tasks:
          - "Set up frontend framework and structure"
          - "Configure build and bundling"
          - "Implement component library foundation"
          - "Set up routing and navigation"
          - "Implement state management"
          - "Create authentication flow"
        dependencies: [~core-backend]

  validation:
    pulses:
      - slug_suffix: integration-test
        title: "Integration Testing"
        role: testing
        estimated_hours: 4
        tasks:
          - "Verify end-to-end development workflow"
          - "Test CI/CD pipeline functionality"
          - "Validate deployment process"
          - "Test authentication flow"
          - "Verify monitoring and logging"
        dependencies: [~core-frontend, ~cicd]

      - slug_suffix: team-validation
        title: "Team Onboarding Validation"
        role: testing
        estimated_hours: 3
        tasks:
          - "Test developer onboarding process"
          - "Verify documentation completeness"
          - "Validate local development setup"
          - "Gather initial team feedback"
          - "Identify and log improvement areas"
        dependencies: [~integration-test]

  documentation:
    pulses:
      - slug_suffix: dev-docs
        title: "Developer Documentation"
        role: documentation
        estimated_hours: 4
        tasks:
          - "Write getting started guide"
          - "Document development workflow"
          - "Create architecture overview"
          - "Document API conventions"
          - "Create troubleshooting guide"
        dependencies: [~team-validation]

      - slug_suffix: ops-docs
        title: "Operations Documentation"
        role: documentation
        estimated_hours: 3
        tasks:
          - "Document deployment procedures"
          - "Create runbooks for common operations"
          - "Document monitoring and alerting"
          - "Create incident response procedures"
          - "Document backup and recovery"
        dependencies: [~team-validation]
