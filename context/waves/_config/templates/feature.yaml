name: "Full-Stack Feature"
slug: feature
version: "1.0"
description: "Complete feature development with design, backend, frontend, testing, and documentation phases. Use for new user-facing functionality that spans multiple layers."
tags: [feature, full-stack, user-facing, new-functionality]

estimated_hours:
  min: 24
  max: 48

roles: [architect, backend, frontend, testing, documentation]

variables:
  required:
    - name: waveName
      type: string
      description: "Name of the wave/feature"
    - name: featureDescription
      type: string
      description: "Brief description of the feature being built"
  optional:
    - name: priority
      type: string
      default: "medium"
      description: "Priority level (low, medium, high, critical)"
    - name: targetRelease
      type: string
      default: ""
      description: "Target release version or date"

stages:
  design:
    pulses:
      - slug_suffix: requirements
        title: "Gather Requirements"
        role: architect
        estimated_hours: 3
        tasks:
          - "Define user stories and acceptance criteria"
          - "Identify stakeholders and gather input"
          - "Document functional requirements"
          - "Document non-functional requirements (performance, security)"
          - "Create initial wireframes or mockups"
        dependencies: []

      - slug_suffix: architecture
        title: "Technical Architecture"
        role: architect
        estimated_hours: 4
        tasks:
          - "Design system architecture and component interactions"
          - "Define API contracts and data models"
          - "Identify integration points with existing systems"
          - "Document technical decisions and trade-offs"
          - "Create architecture diagrams"
        dependencies: [~requirements]

  execution:
    pulses:
      - slug_suffix: backend-api
        title: "Backend API Development"
        role: backend
        estimated_hours: 8
        tasks:
          - "Implement data models and database migrations"
          - "Create API endpoints per specification"
          - "Implement business logic and validations"
          - "Add authentication/authorization as needed"
          - "Write unit tests for backend code"
        dependencies: [~architecture]

      - slug_suffix: frontend-ui
        title: "Frontend UI Development"
        role: frontend
        estimated_hours: 8
        tasks:
          - "Create UI components per design specifications"
          - "Implement state management"
          - "Integrate with backend APIs"
          - "Add form validations and error handling"
          - "Ensure responsive design and accessibility"
        dependencies: [~backend-api]

      - slug_suffix: integration
        title: "Integration and Polish"
        role: frontend
        estimated_hours: 4
        tasks:
          - "Complete end-to-end integration"
          - "Implement loading states and error boundaries"
          - "Add analytics and logging"
          - "Performance optimization"
          - "Cross-browser testing"
        dependencies: [~frontend-ui]

  validation:
    pulses:
      - slug_suffix: testing
        title: "Comprehensive Testing"
        role: testing
        estimated_hours: 6
        tasks:
          - "Write and execute integration tests"
          - "Perform end-to-end testing"
          - "Execute acceptance criteria validation"
          - "Security testing and vulnerability scan"
          - "Performance testing under load"
          - "Regression testing of affected areas"
        dependencies: [~integration]

      - slug_suffix: review
        title: "Code Review and QA Sign-off"
        role: testing
        estimated_hours: 3
        tasks:
          - "Conduct code review with team"
          - "Address review feedback"
          - "QA sign-off on all acceptance criteria"
          - "Verify deployment readiness"
        dependencies: [~testing]

  documentation:
    pulses:
      - slug_suffix: user-docs
        title: "User Documentation"
        role: documentation
        estimated_hours: 3
        tasks:
          - "Write user-facing documentation"
          - "Create usage examples and tutorials"
          - "Update help content and FAQs"
          - "Create release notes content"
        dependencies: [~review]

      - slug_suffix: technical-docs
        title: "Technical Documentation"
        role: documentation
        estimated_hours: 2
        tasks:
          - "Document API endpoints and contracts"
          - "Update architecture documentation"
          - "Document configuration and deployment"
          - "Update runbooks if applicable"
        dependencies: [~review]
