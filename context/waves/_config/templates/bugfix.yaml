name: "Bug Fix"
slug: bugfix
version: "1.0"
description: "Systematic bug investigation, fix implementation, verification, and documentation. Use for addressing reported issues, defects, or unexpected behavior."
tags: [bugfix, defect, issue, hotfix, maintenance]

estimated_hours:
  min: 4
  max: 16

roles: [backend, frontend, testing, documentation]

variables:
  required:
    - name: waveName
      type: string
      description: "Name of the bugfix wave"
    - name: issueId
      type: string
      description: "Issue or ticket ID for tracking"
  optional:
    - name: severity
      type: string
      default: "medium"
      description: "Bug severity (low, medium, high, critical)"
    - name: priority
      type: string
      default: "medium"
      description: "Fix priority (low, medium, high, critical)"
    - name: affectedVersion
      type: string
      default: ""
      description: "Version(s) affected by the bug"
    - name: reporter
      type: string
      default: ""
      description: "Who reported the bug"

stages:
  design:
    pulses:
      - slug_suffix: investigate
        title: "Bug Investigation"
        role: backend
        estimated_hours: 2
        tasks:
          - "Reproduce the bug consistently"
          - "Gather logs, stack traces, and error details"
          - "Identify root cause through debugging"
          - "Document reproduction steps"
          - "Assess impact scope and affected users"
          - "Identify related or similar issues"
        dependencies: []

      - slug_suffix: plan
        title: "Fix Planning"
        role: backend
        estimated_hours: 1
        tasks:
          - "Design fix approach and alternatives"
          - "Assess regression risk"
          - "Identify test cases needed"
          - "Determine if hotfix or regular release"
          - "Plan rollback strategy if needed"
        dependencies: [~investigate]

  execution:
    pulses:
      - slug_suffix: implement
        title: "Implement Fix"
        role: backend
        estimated_hours: 3
        tasks:
          - "Implement the bug fix"
          - "Write unit tests for the fix"
          - "Add test for original bug scenario"
          - "Update any affected components"
          - "Code self-review"
        dependencies: [~plan]

      - slug_suffix: review
        title: "Code Review"
        role: backend
        estimated_hours: 1
        tasks:
          - "Submit code for peer review"
          - "Address review feedback"
          - "Verify fix doesn't introduce new issues"
          - "Final approval from reviewer"
        dependencies: [~implement]

  validation:
    pulses:
      - slug_suffix: verify
        title: "Fix Verification"
        role: testing
        estimated_hours: 2
        tasks:
          - "Verify fix resolves the original issue"
          - "Execute regression tests"
          - "Test edge cases and boundary conditions"
          - "Verify fix in staging environment"
          - "Performance impact assessment"
        dependencies: [~review]

      - slug_suffix: acceptance
        title: "Acceptance Testing"
        role: testing
        estimated_hours: 1
        tasks:
          - "Reporter verification if possible"
          - "QA sign-off on fix"
          - "Verify fix in production-like environment"
          - "Confirm no side effects"
        dependencies: [~verify]

  documentation:
    pulses:
      - slug_suffix: document
        title: "Bug Documentation"
        role: documentation
        estimated_hours: 1
        tasks:
          - "Update issue tracker with resolution"
          - "Document root cause analysis"
          - "Add to known issues if relevant"
          - "Update release notes"
          - "Document any workarounds removed"
          - "Create knowledge base entry if applicable"
        dependencies: [~acceptance]
