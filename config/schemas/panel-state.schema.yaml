# JSON Schema (in YAML) for _panel.yaml per-paper state files
# Validates the structure that panel:go reads and writes

$schema: "http://json-schema.org/draft-07/schema#"
title: Panel State
description: Per-paper review lifecycle state tracked by the panel plugin
type: object

required:
  - paper
  - title
  - venue
  - stage

properties:
  paper:
    type: string
    description: Paper directory name (e.g., panel-review-methodology)
    pattern: "^[a-z0-9-]+$"

  title:
    type: string
    description: Full paper title

  venue:
    type: string
    description: Target venue (e.g., CHI 2026, NeurIPS D&B)

  stage:
    type: string
    enum: [draft, panel, synthesis, revision, recheck, ready, submit, accepted]
    description: Current lifecycle stage

  round:
    type: integer
    minimum: 0
    default: 0
    description: Current review round number

  reviewers:
    type: array
    description: Assigned reviewer panel
    items:
      type: object
      required: [name]
      properties:
        name:
          type: string
        affiliation:
          type: string
        expertise:
          type: string
        score:
          type: [number, "null"]
          minimum: 1
          maximum: 4

  reviews:
    type: object
    description: Review completion status by round
    patternProperties:
      "^round-[0-9]+$":
        type: object
        properties:
          completed:
            type: integer
            minimum: 0
          synthesis:
            type: boolean
          avg_score:
            type: [number, "null"]
          verdict:
            type: string

  p1_items:
    type: array
    description: Priority 1 items from synthesis
    items:
      type: object
      properties:
        item:
          type: string
        addressed:
          type: boolean
        notes:
          type: string

  history:
    type: array
    description: Stage transition history
    items:
      type: object
      required: [stage, date]
      properties:
        stage:
          type: string
        date:
          type: string
          format: date
        note:
          type: string
        round:
          type: integer
